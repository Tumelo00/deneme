name: Collect PS5 reports

on:
  push:
    paths:
      - ".github/workflows/collect-reports.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch relay messages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          curl -fsS --retry 2             "https://ntfy.sh/ps5-1360-tumelo-4m7q2v9x6k3n8r5p1d0c/json?poll=1&since=15m"             -o /tmp/ntfy.jsonl || true
          python - <<'PY'
          import json
          from pathlib import Path

          dst = Path("reports/latest.jsonl")
          existing = {}
          if dst.exists():
              for line in dst.read_text(encoding="utf-8").splitlines():
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  if obj.get("id"):
                      existing[obj["id"]] = obj

          src = Path("/tmp/ntfy.jsonl")
          if src.exists():
              for line in src.read_text(encoding="utf-8").splitlines():
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  if obj.get("event") != "message":
                      continue
                  if obj.get("id"):
                      existing[obj["id"]] = obj

          rows = sorted(existing.values(), key=lambda x: (x.get("time", 0), x.get("id", "")))[-150:]
          dst.write_text(
              "".join(json.dumps(x, ensure_ascii=False, sort_keys=True) + "\n" for x in rows),
              encoding="utf-8",
          )
          PY

      - name: Commit new reports
        shell: bash
        run: |
          set -euo pipefail
          git add reports/latest.jsonl
          if git diff --cached --quiet; then
            echo "No new reports"
            exit 0
          fi
          git config user.name "ps5-report-bot"
          git config user.email "ps5-report-bot@users.noreply.github.com"
          git commit -m "Collect PS5 diagnostic reports"
          git push
