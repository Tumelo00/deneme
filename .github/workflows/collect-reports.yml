name: Collect PS5 reports

on:
  push:
    paths:
      - ".github/workflows/collect-reports.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch relay messages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          curl -fsS --retry 2 \
            "https://ntfy.sh/ps5-1360-tumelo-4m7q2v9x6k3n8r5p1d0c/json?poll=1&since=30m" \
            -o /tmp/ntfy.jsonl || true
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          dst = Path("reports/latest.jsonl")
          existing = {}
          if dst.exists():
              for line in dst.read_text(encoding="utf-8").splitlines():
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  if obj.get("id"):
                      existing[obj["id"]] = obj

          src = Path("/tmp/ntfy.jsonl")
          if src.exists():
              for line in src.read_text(encoding="utf-8").splitlines():
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  if obj.get("event") != "message":
                      continue
                  if obj.get("id"):
                      existing[obj["id"]] = obj

          rows = sorted(existing.values(), key=lambda x: (x.get("time", 0), x.get("id", "")))[-300:]
          dst.write_text(
              "".join(json.dumps(x, ensure_ascii=False, sort_keys=True) + "\n" for x in rows),
              encoding="utf-8",
          )

          # Build a human-readable summary of the newest normal run and newest Advanced Stage A run.
          normal = {}
          advanced = {}
          for obj in rows:
              title = obj.get("title") or ""
              msg = obj.get("message") or ""
              t = obj.get("time", 0)

              m = re.search(r"run=([A-Za-z0-9_-]+)", msg)
              if m and "part=" in msg:
                  rid = m.group(1)
                  normal.setdefault(rid, {"time": t, "parts": []})
                  normal[rid]["time"] = max(normal[rid]["time"], t)
                  normal[rid]["parts"].append(msg)

              am = re.search(r"PSAITO-A-([A-Za-z0-9_-]+)", title)
              mm = re.search(r"PS5 13\.60 ADV-A ([A-Za-z0-9_-]+)", title)
              bm = re.search(r"PS5 13\.60 ADV-B ([A-Za-z0-9_-]+)", title)
              if am:
                  rid = am.group(1)
                  advanced.setdefault(rid, {"time": t, "logs": [], "markers": []})
                  advanced[rid]["time"] = max(advanced[rid]["time"], t)
                  advanced[rid]["logs"].append(msg)
              elif mm or bm:
                  rid = (mm or bm).group(1)
                  advanced.setdefault(rid, {"time": t, "logs": [], "markers": []})
                  advanced[rid]["time"] = max(advanced[rid]["time"], t)
                  advanced[rid]["markers"].append(msg)

          out = []
          out.append("# PS5 13.60 automated research summary")
          out.append("")
          out.append("Generated: " + datetime.now(timezone.utc).isoformat())
          out.append("")

          if normal:
              rid, info = max(normal.items(), key=lambda kv: kv[1]["time"])
              joined = "\n".join(info["parts"])
              fp = next((line for line in joined.splitlines() if line.startswith("FW=")), "not found")
              out += ["## Latest baseline run", "", f"- Run: `{rid}`", f"- Fingerprint: `{fp}`", ""]
          else:
              out += ["## Latest baseline run", "", "No baseline report captured yet.", ""]

          if advanced:
              rid, info = max(advanced.items(), key=lambda kv: kv[1]["time"])
              logs = "\n".join(info["logs"])
              markers = "\n\n".join(info.get("markers", []))
              combined = markers + "\n" + logs
              userland = "phase=USERLAND_HANDOFF" in combined or "ctx=1" in combined
              getpid = ("[canary] getpid ok" in combined
                        or "phase=GETPID_PASS" in combined
                        or "phase=DIRECT_GETPID_PASS" in combined)
              getpid_fail = ("phase=GETPID_FAIL" in combined
                             or "phase=DIRECT_GETPID_FAIL" in combined)
              census = "phase=CAPABILITY_CENSUS_PASS" in combined
              done = "[canary] DONE" in combined or getpid
              bridge = ("BRIDGE-BOOT" in combined or "mode ROP" in combined
                        or "phase=BRIDGE_LOAD_START" in combined
                        or "phase=GETPID_PASS" in combined
                        or "phase=GETPID_FAIL" in combined
                        or "phase=DIRECT_GETPID_START" in combined
                        or "phase=DIRECT_GETPID_PASS" in combined
                        or "phase=DIRECT_GETPID_FAIL" in combined)
              notify1360 = "notify=0x48b0" in combined or "libkernel-rva=0x48b0" in combined
              if getpid:
                  verdict = "PASS — Stage A handoff + bridge/native getpid completed"
              elif getpid_fail or bridge:
                  verdict = "PARTIAL — Stage A passed and bridge/native stage was reached, but getpid did not complete"
              elif userland:
                  verdict = "PASS STAGE A — userland handoff confirmed; Stage B pending"
              elif logs:
                  verdict = "INCOMPLETE — PSAITO ran but the userland handoff was not confirmed"
              else:
                  verdict = "LAUNCHED — marker captured; waiting for runtime telemetry"
              out += [
                  "## Latest Advanced run",
                  "",
                  f"- Run: `{rid}`",
                  f"- Verdict: **{verdict}**",
                  f"- Stage A userland handoff: `{userland}`",
                  f"- Bridge/native stage seen: `{bridge}`",
                  f"- getpid success seen: `{getpid}`",
                  f"- capability census seen: `{census}`",
                  f"- DONE seen: `{done}`",
                  f"- 13.60 notify offset observed: `{notify1360}`",
                  "",
                  "### Stage markers",
                  "```text",
                  markers[-4000:],
                  "```",
                  "",
                  "### Captured PSAITO log lines",
                  "```text",
                  logs[-12000:],
                  "```",
                  "",
              ]
          else:
              out += ["## Latest Advanced run", "", "No advanced canary log captured yet.", ""]

          Path("reports/summary.md").write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Commit new reports
        shell: bash
        run: |
          set -euo pipefail
          git add reports/latest.jsonl reports/summary.md
          if git diff --cached --quiet; then
            echo "No new reports"
            exit 0
          fi
          git config user.name "ps5-report-bot"
          git config user.email "ps5-report-bot@users.noreply.github.com"
          git commit -m "Collect PS5 research reports"
          git push

