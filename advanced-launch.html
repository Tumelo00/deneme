<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PS5 13.60 Advanced Runner</title>
  <style>
    html,body{margin:0;background:#080a0d;color:#e8edf5;font-family:Arial,sans-serif}
    main{max-width:760px;margin:12vh auto;padding:28px}
    h1{font-size:26px;margin:0 0 12px}
    p{line-height:1.5;color:#aeb8c8}
    code{color:#fff}
  </style>
</head>
<body>
<main>
  <h1>Preparing Advanced Stage A…</h1>
  <p>This fresh browser context resets PSAITO's per-tab attempt counter. No additional input is required.</p>
  <p id="status">Sending launch marker…</p>
</main>
<script>
(function () {
  "use strict";
  var topic = "ps5-1360-tumelo-4m7q2v9x6k3n8r5p1d0c";
  var q = new URLSearchParams(location.search);
  var runId = q.get("run") || (Date.now().toString(36) + "-" + Math.floor(Math.random()*0x7fffffff).toString(36));
  var status = document.getElementById("status");

  function sendMarker() {
    var message = "advanced_stage=A\nrun=" + runId + "\nfirmware=13.60\naction=fresh_context_launch";
    var u = "https://ntfy.sh/" + encodeURIComponent(topic) + "/publish?title=" +
      encodeURIComponent("PS5 13.60 ADV-A " + runId) + "&message=" +
      encodeURIComponent(message) + "&tags=computer&_=" + Date.now();
    try {
      if (typeof fetch === "function") {
        fetch(u, {method:"GET", mode:"no-cors"}).catch(function(){});
      }
    } catch (_) {}
    try {
      var img = new Image();
      img.src = u;
      window.__relayImg = img;
    } catch (_) {}
  }

  sendMarker();

  var logEndpoint = "https://ntfy.sh/" + encodeURIComponent(topic) +
    "?title=" + encodeURIComponent("PSAITO-A-" + runId);

  var target = "https://wamphyre.github.io/PSAITO/?" +
    "log=1" +
    "&auto=" + encodeURIComponent("hello_1320.js") +
    "&max=5" +
    "&rd=3000" +
    "&logserver=" + encodeURIComponent(logEndpoint) +
    "&fresh=" + encodeURIComponent(runId);

  status.textContent = "Opening PSAITO with a fresh attempt counter…";
  setTimeout(function () { location.replace(target); }, 1200);
}());
</script>
</body>
</html>
